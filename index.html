<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suffi-Port: พอ-ดี-พอร์ต (Multi-user)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Prompt', sans-serif; background-color: #f3f4f6; } </style>
</head>
<body class="text-gray-800">

    <!-- ================= 1. หน้าลงทะเบียน (Register Screen) ================= -->
    <div id="registerScreen" class="hidden min-h-screen flex items-center justify-center bg-green-600 p-4">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm text-center">
            <h2 class="text-2xl font-bold mb-2">สร้างบัญชีผู้ใช้ใหม่</h2>
            <p class="text-sm text-gray-500 mb-6">สำหรับใช้งานร่วมกันในอุปกรณ์นี้</p>
            
            <input type="text" id="regName" placeholder="ชื่อเล่น หรือ Username" class="w-full p-3 border rounded-lg mb-4 focus:ring-2 focus:ring-green-400 outline-none">
            <input type="password" id="regPin" maxlength="4" placeholder="ตั้งรหัส PIN 4 หลัก" class="text-center text-xl w-full p-3 border rounded-lg mb-4 focus:ring-2 focus:ring-green-400 outline-none">
            <input type="password" id="regPinConfirm" maxlength="4" placeholder="ยืนยันรหัส PIN อีกครั้ง" class="text-center text-xl w-full p-3 border rounded-lg mb-6 focus:ring-2 focus:ring-green-400 outline-none">
            
            <button onclick="registerUser()" class="w-full bg-green-600 text-white font-bold p-3 rounded-lg hover:bg-green-700 transition">ลงทะเบียน</button>
            <p class="mt-4 text-sm">มีบัญชีแล้ว? <button onclick="showScreen('loginScreen')" class="text-blue-600 font-bold hover:underline">เข้าสู่ระบบ</button></p>
        </div>
    </div>

    <!-- ================= 2. หน้าเข้าสู่ระบบ (Login Screen) ================= -->
    <div id="loginScreen" class="hidden min-h-screen flex items-center justify-center bg-green-600 p-4">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm text-center">
            <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4 shadow-inner">
                <span class="text-3xl">👥</span>
            </div>
            <h2 class="text-2xl font-bold mb-1">เข้าสู่ระบบ</h2>
            <p class="text-gray-500 mb-4 text-sm">เลือกบัญชีของคุณ</p>
            
            <input type="text" id="loginName" placeholder="ชื่อผู้ใช้ (Username)" class="w-full p-3 border rounded-lg mb-4 focus:ring-2 focus:ring-green-400 outline-none text-center">
            <input type="password" id="loginPin" maxlength="4" placeholder="รหัส PIN 4 หลัก" class="text-center text-2xl w-full p-3 border rounded-lg mb-6 focus:ring-2 focus:ring-green-400 outline-none">
            
            <button onclick="checkLogin()" class="w-full bg-green-600 text-white font-bold p-3 rounded-lg hover:bg-green-700 transition">เข้าสู่ระบบ</button>
            <p class="mt-4 text-sm">ผู้ใช้ใหม่? <button onclick="showScreen('registerScreen')" class="text-blue-600 font-bold hover:underline">ลงทะเบียนที่นี่</button></p>
        </div>
    </div>

    <!-- ================= 3. หน้าแอปหลัก (Main App) ================= -->
    <div id="mainApp" class="hidden max-w-md mx-auto bg-white min-h-screen shadow-lg pb-20 relative">
        
        <!-- Header -->
        <div class="bg-gradient-to-r from-green-500 to-green-600 text-white p-6 rounded-b-3xl shadow-md flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold tracking-wide">พอ-ดี-พอร์ต</h1>
                <p class="text-xs font-light mt-1 opacity-90" id="displayUser">ผู้ใช้งาน: ...</p>
            </div>
            <button onclick="logout()" class="bg-white/20 hover:bg-white/30 p-2 rounded-lg text-sm font-semibold transition">ออกระบบ</button>
        </div>

        <!-- แท็บ 1: หน้า Dashboard (สรุปผล) -->
        <div id="tab-dashboard" class="p-6 animate-fade-in">
            <div class="bg-white rounded-xl shadow-[0_2px_15px_rgba(0,0,0,0.06)] p-4 mb-6 border border-gray-100">
                <h2 class="font-bold text-gray-700 text-center mb-2">สัดส่วนรายจ่ายของคุณ</h2>
                <div class="relative h-48 w-full">
                    <canvas id="expenseChart"></canvas>
                </div>
            </div>

            <!-- ส่วนหัวประวัติรายการ พร้อมปุ่มรีเฟรช -->
            <div class="flex justify-between items-center mb-3">
                <h2 class="font-bold text-gray-700 flex items-center">
                    <svg class="w-5 h-5 mr-1 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    ประวัติรายการ
                </h2>
                <button onclick="refreshData()" class="text-sm text-blue-600 hover:text-blue-800 bg-blue-50 hover:bg-blue-100 px-3 py-1.5 rounded-lg flex items-center transition-all font-semibold shadow-sm">
                    <svg id="refreshIcon" class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    รีเฟรชข้อมูล
                </button>
            </div>

            <div id="historyData" class="text-sm bg-gray-50 p-3 rounded-xl border h-64 overflow-y-auto">
                <p class="text-center text-gray-500 mt-10">กำลังดึงข้อมูล...</p>
            </div>
        </div>

        <!-- แท็บ 2: หน้าบันทึกรายการ (มี Dropdown แยกย่อย) -->
        <div id="tab-record" class="hidden p-6 animate-fade-in">
            <div class="flex mb-6 bg-gray-100 p-1.5 rounded-xl">
                <button id="btnIncome" onclick="setTxType('income')" class="w-1/2 bg-white text-green-600 py-2.5 rounded-lg font-bold shadow-sm transition-all duration-200">รายรับ</button>
                <button id="btnExpense" onclick="setTxType('expense')" class="w-1/2 text-gray-500 py-2.5 rounded-lg font-bold transition-all duration-200 hover:text-gray-700">รายจ่าย</button>
            </div>
            
            <form id="recordForm" class="space-y-5">
                <input type="hidden" id="txType" value="income">
                
                <div>
                    <label class="text-sm text-gray-600 font-semibold mb-1.5 block">หมวดหมู่</label>
                    <select id="category" class="w-full p-3.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-green-400 bg-white outline-none">
                        <!-- ตัวเลือกจะถูกสร้างจาก JavaScript -->
                    </select>
                </div>

                <div>
                    <label class="text-sm text-gray-600 font-semibold mb-1.5 block">จำนวนเงิน (บาท)</label>
                    <input type="number" id="amount" required placeholder="0.00" class="w-full p-3.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-green-400 text-lg outline-none font-semibold">
                </div>

                <div>
                    <label class="text-sm text-gray-600 font-semibold mb-1.5 block">บันทึกช่วยจำ (ไม่บังคับ)</label>
                    <input type="text" id="note" placeholder="เช่น ซื้อเครื่องเขียน, ได้ค่าขนม" class="w-full p-3.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-green-400 outline-none">
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-blue-500 to-blue-600 text-white font-bold py-4 rounded-xl hover:shadow-lg transition-all duration-200 mt-4 text-lg">
                    บันทึกลงระบบ
                </button>
            </form>
        </div>

        <!-- แถบเมนูด้านล่าง -->
        <div class="absolute bottom-0 w-full max-w-md bg-white border-t flex justify-around p-2 pb-4 shadow-[0_-5px_15px_rgba(0,0,0,0.03)] text-xs font-semibold text-gray-500">
            <button onclick="showTab('dashboard')" class="flex flex-col items-center p-2 text-green-600 w-1/2 rounded-lg hover:bg-green-50 transition" id="nav-dashboard">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z"></path></svg>
                สรุปผล
            </button>
            <button onclick="showTab('record')" class="flex flex-col items-center p-2 w-1/2 rounded-lg hover:bg-gray-50 transition" id="nav-record">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                บันทึกบัญชี
            </button>
        </div>
    </div>

    <!-- ================= ส่วนของ JavaScript ================= -->
    <script>
        // *** 1. นำ URL API อันใหม่จาก Google Apps Script มาใส่ตรงนี้ ***
        const API_URL = "https://script.google.com/macros/s/AKfycby03sXXVMH13Y0V90HE0p8PQE-1AxgkTdknvjh4jIUPiNihsR9mFbLyzx1zQfWXIRcl/exec";
        
        let myChart = null;
        let currentUser = null; // เก็บชื่อผู้ใช้ที่กำลังล็อกอิน

        // --- เริ่มต้นแอป ---
        window.onload = function() {
            currentUser = localStorage.getItem('activeUser');
            if (currentUser) {
                document.getElementById('displayUser').innerText = "ผู้ใช้งาน: " + currentUser;
                showScreen('mainApp');
                setTxType('income'); 
                loadDashboardData();
            } else {
                showScreen('loginScreen');
            }
        };

        function showScreen(screenId) {
            document.getElementById('registerScreen').classList.add('hidden');
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.add('hidden');
            document.getElementById(screenId).classList.remove('hidden');
        }

        // --- ระบบลงทะเบียนแบบหลายคน (Array in LocalStorage) ---
        function registerUser() {
            const name = document.getElementById('regName').value.trim();
            const pin = document.getElementById('regPin').value;
            const pinConfirm = document.getElementById('regPinConfirm').value;

            if(!name || pin.length !== 4) {
                Swal.fire('ข้อมูลไม่ครบ', 'กรุณาระบุชื่อและตั้งรหัส PIN 4 หลัก', 'warning');
                return;
            }
            if(pin !== pinConfirm) {
                Swal.fire('รหัสไม่ตรงกัน', 'กรุณายืนยันรหัส PIN ให้ตรงกัน', 'error');
                return;
            }

            let users = JSON.parse(localStorage.getItem('suffiUsers')) || [];
            
            if(users.find(u => u.name === name)) {
                Swal.fire('ชื่อซ้ำ', 'ชื่อนี้มีผู้ใช้งานแล้ว โปรดใช้ชื่ออื่น', 'error');
                return;
            }

            users.push({ name: name, pin: pin });
            localStorage.setItem('suffiUsers', JSON.stringify(users));
            
            Swal.fire('สำเร็จ', 'สร้างบัญชีเรียบร้อยแล้ว', 'success').then(() => {
                document.getElementById('regName').value = "";
                document.getElementById('regPin').value = "";
                document.getElementById('regPinConfirm').value = "";
                document.getElementById('loginName').value = name; 
                showScreen('loginScreen');
            });
        }

        // --- ระบบเข้าสู่ระบบ (เช็คจาก Array) ---
        function checkLogin() {
            const name = document.getElementById('loginName').value.trim();
            const pin = document.getElementById('loginPin').value;
            
            let users = JSON.parse(localStorage.getItem('suffiUsers')) || [];
            let validUser = users.find(u => u.name === name && u.pin === pin);

            if(validUser) {
                currentUser = validUser.name;
                localStorage.setItem('activeUser', currentUser); 
                
                document.getElementById('loginPin').value = ""; 
                document.getElementById('displayUser').innerText = "ผู้ใช้งาน: " + currentUser;
                showScreen('mainApp');
                setTxType('income');
                loadDashboardData(); 
            } else {
                Swal.fire('ผิดพลาด', 'ชื่อผู้ใช้ หรือ รหัส PIN ไม่ถูกต้อง', 'error');
            }
        }

        // --- ระบบออกจากระบบ (Logout) ---
        function logout() {
            localStorage.removeItem('activeUser');
            currentUser = null;
            showScreen('loginScreen');
        }

        // --- สลับหน้าแท็บ ---
        function showTab(tabName) {
            document.getElementById('tab-dashboard').classList.add('hidden');
            document.getElementById('tab-record').classList.add('hidden');
            document.getElementById('tab-' + tabName).classList.remove('hidden');

            document.getElementById('nav-dashboard').classList.replace('text-green-600', 'text-gray-500');
            document.getElementById('nav-record').classList.replace('text-green-600', 'text-gray-500');
            document.getElementById('nav-' + tabName).classList.replace('text-gray-500', 'text-green-600');
        }

        // --- สลับประเภทฟอร์มบันทึก พร้อม Dropdown แบบจัดกลุ่ม (Optgroup) ---
        function setTxType(type) {
            document.getElementById('txType').value = type;
            const categorySelect = document.getElementById('category');
            const btnIncome = document.getElementById('btnIncome');
            const btnExpense = document.getElementById('btnExpense');
            
            if(type === 'income') {
                btnIncome.className = "w-1/2 bg-white text-green-600 py-2.5 rounded-lg font-bold shadow-sm transition-all duration-200";
                btnExpense.className = "w-1/2 text-gray-500 py-2.5 rounded-lg font-bold transition-all duration-200 hover:text-gray-700";
                categorySelect.innerHTML = `
                    <option value="ค่าขนมประจำ">ค่าขนมรายวัน/รายสัปดาห์</option>
                    <option value="รายได้พิเศษ">รายได้พิเศษ (ทำงาน/รับจ้าง)</option>
                    <option value="ผู้ปกครองให้เพิ่ม">ผู้ปกครองให้เพิ่ม</option>
                `;
            } else {
                btnExpense.className = "w-1/2 bg-white text-red-600 py-2.5 rounded-lg font-bold shadow-sm transition-all duration-200";
                btnIncome.className = "w-1/2 text-gray-500 py-2.5 rounded-lg font-bold transition-all duration-200 hover:text-gray-700";
                categorySelect.innerHTML = `
                    <optgroup label="✅ เพื่อออม (Savings 20%)">
                        <option value="Save-กระปุก">หยอดกระปุกออมสิน</option>
                        <option value="Save-ธนาคาร">ฝากธนาคาร</option>
                    </optgroup>
                    <optgroup label="✅ สิ่งจำเป็น (Needs 50%)">
                        <option value="Need-อาหาร">อาหารและเครื่องดื่ม (มื้อหลัก)</option>
                        <option value="Need-การเรียน">อุปกรณ์การเรียน/หนังสือ</option>
                        <option value="Need-เดินทาง">ค่าเดินทาง</option>
                    </optgroup>
                    <optgroup label="⚠️ ฟุ่มเฟือย (Wants 30%)">
                        <option value="Want-เกม/ของเล่น">เติมเกม / ของเล่น</option>
                        <option value="Want-ขนมจุกจิก">ขนมจุกจิก / เครื่องดื่มหวาน</option>
                        <option value="Want-แฟชั่น/อื่นๆ">เสื้อผ้า / ของสะสม / อื่นๆ</option>
                    </optgroup>
                `;
            }
        }

        // --- ดักจับฟอร์มก่อนส่ง (ระบบแจ้งเตือนอสมการความพอเพียง) ---
        document.getElementById('recordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const type = document.getElementById('txType').value;
            const category = document.getElementById('category').value;
            const amount = parseFloat(document.getElementById('amount').value);

            // เช็คหมวดฟุ่มเฟือย
            if(type === 'expense' && category.startsWith("Want")) {
                Swal.fire({
                    title: 'เตือนสติก่อนจ่าย!',
                    html: `เงิน <b>${amount}</b> บาทนี้<br>เทียบเท่าค่าข้าวกลางวัน (40฿) ได้ <b>${(amount/40).toFixed(1)} มื้อ</b><br>แน่ใจนะว่าวิเคราะห์ความคุ้มค่าแล้ว?`,
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#10B981',
                    cancelButtonColor: '#EF4444',
                    confirmButtonText: 'วิเคราะห์แล้ว ยืนยันซื้อ',
                    cancelButtonText: 'เก็บเงินออมดีกว่า'
                }).then((result) => {
                    if (result.isConfirmed) { saveToGoogleSheets(type, category, amount); }
                })
            } else {
                saveToGoogleSheets(type, category, amount);
            }
        });

        // --- ส่งข้อมูลเข้า API พร้อมชื่อผู้ใช้ปัจจุบัน ---
        function saveToGoogleSheets(type, category, amount) {
            const data = {
                type: type,
                category: category,
                amount: amount,
                note: document.getElementById('note').value,
                user: currentUser 
            };

            Swal.fire({
                title: 'กำลังอัปเดตพอร์ตส่วนตัว...',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading() }
            });

            fetch(API_URL, {
                method: 'POST',
                redirect: 'follow', 
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                Swal.fire('สำเร็จ!', 'บันทึกข้อมูลเรียบร้อย', 'success');
                document.getElementById('recordForm').reset();
                setTxType('income'); 
                loadDashboardData(); 
            })
            .catch(error => {
                console.error('Error:', error);
                Swal.fire('ผิดพลาด', 'เชื่อมต่อขัดข้อง โปรดตรวจสอบการตั้งค่า Deploy', 'error');
            });
        }

        // --- ฟังก์ชันสำหรับปุ่มรีเฟรช ---
        function refreshData() {
            const refreshIcon = document.getElementById('refreshIcon');
            refreshIcon.classList.add('animate-spin'); // ใส่แอนิเมชันให้ไอคอนหมุน
            
            // ใช้ setTimeout เพื่อให้เห็นว่าปุ่มทำงานแม้จะโหลดเร็วมาก
            setTimeout(() => {
                loadDashboardData();
            }, 500);
        }

        // --- โหลดข้อมูล และคัดกรองเฉพาะข้อมูลของผู้ใช้คนปัจจุบัน ---
        function loadDashboardData() {
            const historyContainer = document.getElementById('historyData');
            const refreshIcon = document.getElementById('refreshIcon');
            
            fetch(API_URL)
            .then(response => response.json())
            .then(data => {
                // คัดกรอง (Filter) เอาเฉพาะข้อมูลที่ user ตรงกับคนที่ล็อกอินอยู่
                let myData = data.filter(item => item.user === currentUser);

                if(myData.length === 0) {
                    historyContainer.innerHTML = '<p class="text-center text-gray-500 mt-10">ยังไม่มีรายการบันทึกของคุณ</p>';
                    updateChart(0,0,0);
                    if(refreshIcon) refreshIcon.classList.remove('animate-spin'); // หยุดหมุน
                    return;
                }
                
                let html = '<ul class="space-y-2">';
                let totalNeeds = 0, totalWants = 0, totalSavings = 0;

                for(let i = myData.length - 1; i >= 0; i--) {
                    let item = myData[i];
                    let isIncome = item.type === 'income';
                    
                    let displayCategory = item.category.replace('Need-', '').replace('Want-', '').replace('Save-', '');
                    let colorClass = isIncome ? 'text-green-600' : (item.category.startsWith('Want') ? 'text-red-500' : 'text-blue-500');
                    let sign = isIncome ? '+' : '-';
                    let dateStr = new Date(item.timestamp).toLocaleDateString('th-TH');
                    let noteText = item.note ? item.note : '-';

                    html += `
                    <li class="flex justify-between items-center bg-white p-3 rounded-lg border border-gray-100 shadow-sm">
                        <div>
                            <p class="font-bold text-sm text-gray-700">${displayCategory}</p>
                            <p class="text-xs text-gray-400">${dateStr} • ${noteText}</p>
                        </div>
                        <div class="${colorClass} font-bold text-base">
                            ${sign}${item.amount} ฿
                        </div>
                    </li>`;

                    if(!isIncome) {
                        if(item.category.startsWith('Need')) totalNeeds += parseFloat(item.amount);
                        if(item.category.startsWith('Want')) totalWants += parseFloat(item.amount);
                        if(item.category.startsWith('Save')) totalSavings += parseFloat(item.amount);
                    }
                }
                html += '</ul>';
                historyContainer.innerHTML = html;
                updateChart(totalNeeds, totalWants, totalSavings);

                if(refreshIcon) refreshIcon.classList.remove('animate-spin'); // หยุดหมุนเมื่อโหลดเสร็จ
            })
            .catch(error => {
                console.error('Error:', error);
                historyContainer.innerHTML = '<p class="text-center text-red-500 mt-10">ดึงข้อมูลล้มเหลว</p>';
                if(refreshIcon) refreshIcon.classList.remove('animate-spin'); // หยุดหมุน
            });
        }

        // --- วาดกราฟวงกลม (Chart.js) ---
        function updateChart(needs, wants, savings) {
            const ctx = document.getElementById('expenseChart').getContext('2d');
            if(myChart != null) { myChart.destroy(); }
            if(needs === 0 && wants === 0 && savings === 0) { needs = 1; } 

            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['สิ่งจำเป็น (Needs)', 'ฟุ่มเฟือย (Wants)', 'เงินออม (Savings)'],
                    datasets: [{
                        data: [needs, wants, savings],
                        backgroundColor: ['#3B82F6', '#EF4444', '#10B981'],
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { font: { family: 'Prompt' }, boxWidth: 12 } }
                    },
                    cutout: '65%'
                }
            });
        }
    </script>
</body>
</html>
