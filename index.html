<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>พอ-ดี-พอร์ต (Suffi-Port)</title>
    <!-- อ้างอิง Tailwind CSS สำหรับการจัดสไตล์แบบโมเดิร์น -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body class="text-gray-800">

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg">
        <!-- Header -->
        <div class="bg-green-600 text-white p-6 rounded-b-3xl shadow-md">
            <h1 class="text-2xl font-bold text-center">พอ-ดี-พอร์ต</h1>
            <p class="text-center text-sm font-light mt-1">ดัชนีภูมิคุ้มกันทางการเงินของคุณ</p>
            
            <!-- การคำนวณดัชนีความพอเพียง (Sufficiency Index) -->
            <div class="mt-6 bg-white/20 rounded-xl p-4 text-center backdrop-blur-sm border border-white/30">
                <p class="text-sm">Sufficiency Index (SI)</p>
                <h2 class="text-4xl font-bold mt-2">85<span class="text-lg">%</span></h2>
                <p class="text-xs mt-2">ยอดเยี่ยม! คุณมีภูมิคุ้มกันทางการเงินที่ดี</p>
            </div>
        </div>

        <!-- Content -->
        <div class="p-6">
            <!-- เครื่องคิดเลขค่าเสียโอกาส (Opportunity Cost Scanner) -->
            <div class="bg-blue-50 border border-blue-100 rounded-xl p-5 mb-6 shadow-sm">
                <h3 class="font-semibold text-blue-800 mb-3 flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    สแกนค่าเสียโอกาสก่อนซื้อ!
                </h3>
                <input type="number" id="wantPrice" placeholder="ราคาสินค้าฟุ่มเฟือย (บาท)" class="w-full p-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-400 mb-3 text-sm">
                <button onclick="calculateOpportunityCost()" class="w-full bg-blue-500 text-white font-medium py-2 rounded-lg hover:bg-blue-600 transition text-sm">ประเมินความคุ้มค่า</button>
                <p id="costResult" class="mt-3 text-sm text-blue-900 hidden"></p>
            </div>

            <!-- ฟอร์มบันทึกข้อมูล -->
            <h3 class="font-semibold text-gray-700 mb-4">บันทึกรายการใหม่</h3>
            <form id="transactionForm" class="space-y-4">
                <select id="type" class="w-full p-3 rounded-lg border border-gray-200 focus:ring-2 focus:ring-green-400 text-sm">
                    <option value="รายจ่าย">รายจ่าย</option>
                    <option value="รายรับ">รายรับ</option>
                </select>
                
                <select id="category" class="w-full p-3 rounded-lg border border-gray-200 focus:ring-2 focus:ring-green-400 text-sm">
                    <option value="Needs">สิ่งจำเป็น (Needs)</option>
                    <option value="Wants">สิ่งของฟุ่มเฟือย (Wants)</option>
                    <option value="Savings">เงินออม (Savings)</option>
                </select>

                <input type="number" id="amount" placeholder="จำนวนเงิน (บาท)" required class="w-full p-3 rounded-lg border border-gray-200 focus:ring-2 focus:ring-green-400 text-sm">
                
                <input type="text" id="note" placeholder="บันทึกช่วยจำ (เช่น ซื้อขนม, ค่ารถ)" class="w-full p-3 rounded-lg border border-gray-200 focus:ring-2 focus:ring-green-400 text-sm">
                
                <button type="submit" id="submitBtn" class="w-full bg-green-600 text-white font-semibold py-3 rounded-xl shadow-md hover:bg-green-700 transition">
                    บันทึกลงระบบ
                </button>
            </form>
        </div>
    </div>

    <script>
        // *** นำ URL เว็บแอปจาก Google Apps Script มาใส่ในเครื่องหมายคำพูดด้านล่างนี้ ***
        const API_URL = "https://script.google.com/macros/s/AKfycby03sXXVMH13Y0V90HE0p8PQE-1AxgkTdknvjh4jIUPiNihsR9mFbLyzx1zQfWXIRcl/exec";

        // สมการคำนวณค่าเสียโอกาส (บัญญัติไตรยางศ์)
        function calculateOpportunityCost() {
            const price = parseFloat(document.getElementById('wantPrice').value);
            const resultElement = document.getElementById('costResult');
            const mealPrice = 40; // ราคาข้าวกลางวันเฉลี่ย 40 บาท

            if(isNaN(price) || price <= 0) {
                alert("กรุณากรอกราคาให้ถูกต้อง");
                return;
            }

            const meals = (price / mealPrice).toFixed(1);
            resultElement.innerHTML = `💸 เงิน <b>${price}</b> บาทนี้<br>เทียบเท่ากับค่าข้าวกลางวันถึง <b>${meals} มื้อ</b>!<br><em>(แน่ใจนะว่าอยากซื้อจริงๆ?)</em>`;
            resultElement.classList.remove('hidden');
        }

        // จัดการส่งข้อมูลผ่าน API
        document.getElementById('transactionForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = "กำลังบันทึก...";
            btn.disabled = true;

            const data = {
                type: document.getElementById('type').value,
                category: document.getElementById('category').value,
                amount: parseFloat(document.getElementById('amount').value),
                note: document.getElementById('note').value
            };

            fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                alert("บันทึกข้อมูลเรียบร้อยแล้ว!");
                document.getElementById('transactionForm').reset();
            })
            .catch(error => {
                console.error('Error:', error);
                alert("เกิดข้อผิดพลาดในการบันทึก");
            })
            .finally(() => {
                btn.innerHTML = "บันทึกลงระบบ";
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
