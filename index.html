<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Suffi-Port: FinTech Application</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- นำเข้า Chart.js สำหรับทำกราฟ Dashboard -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- นำเข้า SweetAlert2 สำหรับระบบแจ้งเตือนสุดล้ำ -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Prompt', sans-serif; } </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- ส่วนที่ 1: ระบบ Login (ซ่อนเนื้อหาหลักจนกว่าจะกรอก PIN ถูก) -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center bg-green-600">
        <div class="bg-white p-8 rounded-xl shadow-lg text-center">
            <h2 class="text-2xl font-bold mb-4">เข้าสู่ระบบ Suffi-Port</h2>
            <input type="password" id="pinInput" maxlength="4" placeholder="ระบุ PIN 4 หลัก" class="text-center text-2xl w-full p-3 border rounded mb-4">
            <button onclick="checkLogin()" class="w-full bg-green-500 text-white p-3 rounded-lg">ตกลง</button>
        </div>
    </div>

    <!-- ส่วนเนื้อหาหลัก (จะแสดงเมื่อ Login ผ่าน) -->
    <div id="mainApp" class="hidden max-w-md mx-auto bg-white min-h-screen shadow-lg pb-20">
        
        <!-- แถบเมนูด้านล่าง (Bottom Navigation) สำหรับสลับหน้า -->
        <div class="fixed bottom-0 w-full max-w-md bg-white border-t flex justify-around p-3 text-xs">
            <button onclick="showTab('dashboard')" class="flex flex-col items-center"><span class="text-xl">📊</span>สรุปผล</button>
            <button onclick="showTab('record')" class="flex flex-col items-center"><span class="text-xl">📝</span>บันทึก</button>
            <button onclick="showTab('aiTax')" class="flex flex-col items-center"><span class="text-xl">🤖</span>AI & ภาษี</button>
        </div>

        <!-- หน้า Dashboard & ข้อมูลย้อนหลัง -->
        <div id="tab-dashboard" class="p-6">
            <h2 class="text-xl font-bold mb-4">สถานะการเงินของคุณ</h2>
            <canvas id="myPieChart" class="mb-6"></canvas> <!-- พื้นที่แสดงกราฟวงกลม -->
            
            <h3 class="font-bold mb-2">ประวัติย้อนหลัง</h3>
            <div id="historyData" class="text-sm bg-gray-50 p-3 rounded-lg h-40 overflow-y-auto">
                <!-- ข้อมูลจาก Google Sheets จะมาแสดงที่นี่ -->
            </div>
        </div>

        <!-- หน้าบันทึก (แยกรายรับ-รายจ่าย) -->
        <div id="tab-record" class="hidden p-6">
            <div class="flex mb-4">
                <button onclick="setTxType('income')" class="w-1/2 bg-green-100 text-green-700 py-2 rounded-l-lg font-bold">รายรับ</button>
                <button onclick="setTxType('expense')" class="w-1/2 bg-red-100 text-red-700 py-2 rounded-r-lg font-bold">รายจ่าย</button>
            </div>
            
            <form id="recordForm" class="space-y-4">
                <input type="hidden" id="txType" value="income">
                <select id="category" class="w-full p-3 border rounded">
                    <!-- จะเปลี่ยนไปตามประเภทรายรับ/รายจ่าย -->
                    <option value="Savings">เงินออม (Savings)</option>
                    <option value="Needs">สิ่งจำเป็น (Needs)</option>
                    <option value="Wants">ฟุ่มเฟือย (Wants)</option>
                </select>
                <input type="number" id="amount" placeholder="จำนวนเงิน" class="w-full p-3 border rounded">
                <input type="text" id="note" placeholder="บันทึกช่วยจำ" class="w-full p-3 border rounded">
                <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded-lg font-bold">บันทึกรายการ</button>
            </form>
        </div>

    </div>

    <script>
        // --- 1. ระบบ Login (ตัวอย่างใช้ LocalStorage) ---
        function checkLogin() {
            const pin = document.getElementById('pinInput').value;
            // สมมติว่า PIN คือ 1234 (ในการใช้งานจริงสามารถบันทึก PIN แรกลง LocalStorage ได้)
            if(pin === "1234") {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                loadDashboardData(); // โหลดข้อมูลเมื่อเข้าสู่ระบบสำเร็จ
            } else {
                Swal.fire('ผิดพลาด', 'รหัส PIN ไม่ถูกต้อง', 'error');
            }
        }

        // --- 2. ฟังก์ชันสลับหน้าเว็บ (Tabs) ---
        function showTab(tabName) {
            document.getElementById('tab-dashboard').classList.add('hidden');
            document.getElementById('tab-record').classList.add('hidden');
            // ... (ซ่อนแท็บอื่นๆ)
            document.getElementById('tab-' + tabName).classList.remove('hidden');
        }

        // --- 4 & 7. ระบบแจ้งเตือนเมื่อใช้เงินฟุ่มเฟือย (ก่อนส่งขึ้น Google Sheets) ---
        document.getElementById('recordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const category = document.getElementById('category').value;
            const amount = parseFloat(document.getElementById('amount').value);

            // เงื่อนไขตรวจสอบ: ถ้าเลือกฟุ่มเฟือย (Wants) 
            if(category === "Wants") {
                // ใช้การแจ้งเตือนแบบล้ำๆ ด้วย SweetAlert2
                Swal.fire({
                    title: 'เดี๋ยวก่อน!',
                    text: "ยอดนี้เป็นของฟุ่มเฟือย แน่ใจนะว่าไม่กระทบเงินออม?",
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#3085d6',
                    cancelButtonColor: '#d33',
                    confirmButtonText: 'คิดดีแล้ว ยืนยันซื้อ',
                    cancelButtonText: 'ยกเลิกดีกว่า'
                }).then((result) => {
                    if (result.isConfirmed) {
                        saveToGoogleSheets(); // เรียกฟังก์ชันบันทึก API
                    }
                })
            } else {
                saveToGoogleSheets();
            }
        });

        function saveToGoogleSheets() {
            // โค้ด Fetch API ไปยัง Google Apps Script (ตามที่เขียนไว้ในเวอร์ชันแรก)
            Swal.fire('สำเร็จ', 'บันทึกข้อมูลเรียบร้อย', 'success');
        }

        // --- ฟังก์ชัน AI (แนวทางการเรียกใช้ Gemini API) ---
        // ข้อควรระวัง: สำหรับโครงงาน ควรใช้ API Key ทางฝั่ง Backend (GAS) เพื่อความปลอดภัย 
        // หรือจำลองโมเดล If-Else ขั้นสูงใน JS แทนหากไม่อยากต่อ API จริง
    </script>
</body>
</html>
