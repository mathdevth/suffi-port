<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suffi-Port: FinTech Application</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Prompt', sans-serif; background-color: #f3f4f6; } </style>
</head>
<body class="text-gray-800">

    <!-- 1. หน้าลงทะเบียน (Register Screen) -->
    <div id="registerScreen" class="hidden min-h-screen flex items-center justify-center bg-green-600 p-4">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm text-center">
            <h2 class="text-2xl font-bold mb-2">สร้างบัญชีผู้ใช้</h2>
            <p class="text-sm text-gray-500 mb-6">เริ่มวางแผนการเงินกับ พอ-ดี-พอร์ต</p>
            
            <input type="text" id="regName" placeholder="ชื่อเล่นของคุณ" class="w-full p-3 border rounded-lg mb-4 focus:ring-2 focus:ring-green-400">
            <input type="password" id="regPin" maxlength="4" placeholder="ตั้งรหัส PIN 4 หลัก" class="text-center text-xl w-full p-3 border rounded-lg mb-4 focus:ring-2 focus:ring-green-400">
            <input type="password" id="regPinConfirm" maxlength="4" placeholder="ยืนยันรหัส PIN อีกครั้ง" class="text-center text-xl w-full p-3 border rounded-lg mb-6 focus:ring-2 focus:ring-green-400">
            
            <button onclick="registerUser()" class="w-full bg-green-600 text-white font-bold p-3 rounded-lg hover:bg-green-700">ลงทะเบียน</button>
            <p class="mt-4 text-sm">มีบัญชีแล้ว? <button onclick="showScreen('loginScreen')" class="text-blue-600 font-bold">เข้าสู่ระบบ</button></p>
        </div>
    </div>

    <!-- 2. หน้าเข้าสู่ระบบ (Login Screen) -->
    <div id="loginScreen" class="hidden min-h-screen flex items-center justify-center bg-green-600 p-4">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm text-center">
            <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <span class="text-3xl">🌱</span>
            </div>
            <h2 class="text-2xl font-bold mb-1">ยินดีต้อนรับกลับมา</h2>
            <p id="welcomeName" class="text-green-600 font-semibold mb-6">คุณ ...</p>
            
            <input type="password" id="loginPin" maxlength="4" placeholder="ระบุ PIN 4 หลัก" class="text-center text-2xl w-full p-3 border rounded-lg mb-6 focus:ring-2 focus:ring-green-400">
            
            <button onclick="checkLogin()" class="w-full bg-green-600 text-white font-bold p-3 rounded-lg hover:bg-green-700">เข้าสู่ระบบ</button>
            <button onclick="resetAccount()" class="mt-4 text-xs text-red-400 hover:text-red-600">ล้างข้อมูลบัญชี (เริ่มใหม่)</button>
        </div>
    </div>

    <!-- 3. หน้าแอปหลัก (Main App) -->
    <div id="mainApp" class="hidden max-w-md mx-auto bg-white min-h-screen shadow-lg pb-20">
        
        <!-- Header -->
        <div class="bg-green-600 text-white p-6 rounded-b-3xl shadow-md text-center">
            <h1 class="text-2xl font-bold">พอ-ดี-พอร์ต</h1>
            <p class="text-sm font-light mt-1">ดัชนีภูมิคุ้มกันทางการเงิน</p>
        </div>

        <!-- หน้า Dashboard -->
        <div id="tab-dashboard" class="p-6">
            <h2 class="font-bold text-gray-700 mb-2">สรุปรายการย้อนหลัง</h2>
            <div id="historyData" class="text-sm bg-gray-50 p-4 rounded-xl border h-64 overflow-y-auto">
                <p class="text-center text-gray-500 mt-10">กำลังดึงข้อมูล...</p>
            </div>
        </div>

        <!-- หน้าบันทึกรายการ -->
        <div id="tab-record" class="hidden p-6">
            <div class="flex mb-5 bg-gray-100 p-1 rounded-lg">
                <button id="btnIncome" onclick="setTxType('income')" class="w-1/2 bg-white text-green-600 py-2 rounded-md font-bold shadow-sm transition">รายรับ</button>
                <button id="btnExpense" onclick="setTxType('expense')" class="w-1/2 text-gray-500 py-2 rounded-md font-bold transition">รายจ่าย</button>
            </div>
            
            <form id="recordForm" class="space-y-4">
                <input type="hidden" id="txType" value="income">
                
                <div>
                    <label class="text-sm text-gray-600 font-semibold mb-1 block">หมวดหมู่</label>
                    <select id="category" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-green-400 bg-white">
                        <option value="ค่าขนม">ค่าขนม</option>
                        <option value="รายได้พิเศษ">รายได้พิเศษ</option>
                    </select>
                </div>

                <div>
                    <label class="text-sm text-gray-600 font-semibold mb-1 block">จำนวนเงิน (บาท)</label>
                    <input type="number" id="amount" required placeholder="0.00" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-green-400 text-lg">
                </div>

                <div>
                    <label class="text-sm text-gray-600 font-semibold mb-1 block">บันทึกช่วยจำ</label>
                    <input type="text" id="note" placeholder="เช่น ซื้อเครื่องเขียน, ได้เงินไปโรงเรียน" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-green-400">
                </div>

                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 shadow-md mt-2">
                    บันทึกรายการ
                </button>
            </form>
        </div>

        <!-- แถบเมนูด้านล่าง (Bottom Navigation) -->
        <div class="fixed bottom-0 w-full max-w-md bg-white border-t flex justify-around p-2 pb-4 shadow-[0_-2px_10px_rgba(0,0,0,0.05)] text-xs font-semibold text-gray-500">
            <button onclick="showTab('dashboard')" class="flex flex-col items-center p-2 text-green-600" id="nav-dashboard">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z"></path></svg>
                หน้าแรก
            </button>
            <button onclick="showTab('record')" class="flex flex-col items-center p-2" id="nav-record">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                บันทึก
            </button>
        </div>
    </div>

    <script>
        // --- นำ API URL มาใส่เรียบร้อยแล้ว ---
        const API_URL = "https://script.google.com/macros/s/AKfycby03sXXVMH13Y0V90HE0p8PQE-1AxgkTdknvjh4jIUPiNihsR9mFbLyzx1zQfWXIRcl/exec";

        // --- ระบบตรวจสอบผู้ใช้เมื่อเปิดเว็บครั้งแรก ---
        window.onload = function() {
            const savedPin = localStorage.getItem('userPin');
            if (savedPin) {
                // ถ้ามีข้อมูลผู้ใช้แล้ว ให้แสดงหน้า Login
                document.getElementById('welcomeName').innerText = "คุณ " + localStorage.getItem('userName');
                showScreen('loginScreen');
            } else {
                // ถ้ายังไม่มีข้อมูล ให้แสดงหน้าลงทะเบียน
                showScreen('registerScreen');
            }
        };

        function showScreen(screenId) {
            document.getElementById('registerScreen').classList.add('hidden');
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.add('hidden');
            document.getElementById(screenId).classList.remove('hidden');
        }

        // --- ระบบลงทะเบียน (บันทึกข้อมูลลงเครื่อง) ---
        function registerUser() {
            const name = document.getElementById('regName').value;
            const pin = document.getElementById('regPin').value;
            const pinConfirm = document.getElementById('regPinConfirm').value;

            if(!name || pin.length !== 4) {
                Swal.fire('ข้อมูลไม่ครบ', 'กรุณาระบุชื่อและตั้งรหัส PIN 4 หลัก', 'warning');
                return;
            }
            if(pin !== pinConfirm) {
                Swal.fire('รหัสไม่ตรงกัน', 'กรุณายืนยันรหัส PIN ให้ตรงกัน', 'error');
                return;
            }

            localStorage.setItem('userName', name);
            localStorage.setItem('userPin', pin);
            
            Swal.fire('สำเร็จ', 'สร้างบัญชีเรียบร้อยแล้ว', 'success').then(() => {
                document.getElementById('welcomeName').innerText = "คุณ " + name;
                showScreen('loginScreen');
            });
        }

        // --- ระบบเข้าสู่ระบบ ---
        function checkLogin() {
            const inputPin = document.getElementById('loginPin').value;
            const savedPin = localStorage.getItem('userPin');

            if(inputPin === savedPin) {
                document.getElementById('loginPin').value = ""; // เคลียร์รหัสผ่าน
                showScreen('mainApp');
                loadDashboardData(); // ดึงข้อมูลทันที
            } else {
                Swal.fire('ผิดพลาด', 'รหัส PIN ไม่ถูกต้อง', 'error');
            }
        }

        // --- ระบบล้างบัญชี (กรณีลืมรหัส) ---
        function resetAccount() {
            Swal.fire({
                title: 'ต้องการล้างข้อมูล?',
                text: "รหัส PIN และชื่อจะถูกลบออกจากระบบ",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'ล้างข้อมูล',
                cancelButtonText: 'ยกเลิก'
            }).then((result) => {
                if (result.isConfirmed) {
                    localStorage.removeItem('userName');
                    localStorage.removeItem('userPin');
                    showScreen('registerScreen');
                }
            })
        }

        // --- ระบบสลับหน้าแท็บ (Tabs) ในแอป ---
        function showTab(tabName) {
            document.getElementById('tab-dashboard').classList.add('hidden');
            document.getElementById('tab-record').classList.add('hidden');
            document.getElementById('tab-' + tabName).classList.remove('hidden');

            // ปรับสีไอคอนเมนูด้านล่าง
            document.getElementById('nav-dashboard').classList.replace('text-green-600', 'text-gray-500');
            document.getElementById('nav-record').classList.replace('text-green-600', 'text-gray-500');
            document.getElementById('nav-' + tabName).classList.replace('text-gray-500', 'text-green-600');
        }

        // --- ระบบสลับประเภท รายรับ/รายจ่าย ---
        function setTxType(type) {
            document.getElementById('txType').value = type;
            const categorySelect = document.getElementById('category');
            const btnIncome = document.getElementById('btnIncome');
            const btnExpense = document.getElementById('btnExpense');
            
            categorySelect.innerHTML = ''; 
            
            if(type === 'income') {
                btnIncome.className = "w-1/2 bg-white text-green-600 py-2 rounded-md font-bold shadow-sm transition";
                btnExpense.className = "w-1/2 text-gray-500 py-2 rounded-md font-bold transition";
                categorySelect.innerHTML = '<option value="ค่าขนม">ค่าขนม</option><option value="รายได้พิเศษ">รายได้พิเศษ</option>';
            } else {
                btnExpense.className = "w-1/2 bg-white text-red-600 py-2 rounded-md font-bold shadow-sm transition";
                btnIncome.className = "w-1/2 text-gray-500 py-2 rounded-md font-bold transition";
                categorySelect.innerHTML = '<option value="Savings">เงินออม (Savings)</option><option value="Needs">สิ่งจำเป็น (Needs)</option><option value="Wants">ฟุ่มเฟือย (Wants)</option>';
            }
        }

        // --- ส่งข้อมูลและแจ้งเตือนความพอเพียง (API POST) ---
        document.getElementById('recordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const type = document.getElementById('txType').value;
            const category = document.getElementById('category').value;
            const amount = parseFloat(document.getElementById('amount').value);

            if(type === 'expense' && category === "Wants") {
                Swal.fire({
                    title: 'เดี๋ยวก่อน!',
                    text: "รายการนี้เป็นของฟุ่มเฟือย แน่ใจนะว่าวิเคราะห์ความคุ้มค่าแล้ว?",
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#10B981',
                    cancelButtonColor: '#EF4444',
                    confirmButtonText: 'ยืนยันซื้อ',
                    cancelButtonText: 'ยกเลิกดีกว่า'
                }).then((result) => {
                    if (result.isConfirmed) {
                        saveToGoogleSheets(type, category, amount);
                    }
                })
            } else {
                saveToGoogleSheets(type, category, amount);
            }
        });

        function saveToGoogleSheets(type, category, amount) {
            const data = {
                type: type,
                category: category,
                amount: amount,
                note: document.getElementById('note').value
            };

            Swal.fire({
                title: 'กำลังส่งข้อมูลเข้าฐานข้อมูล...',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading() }
            });

            fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                Swal.fire('สำเร็จ!', 'บันทึกข้อมูลเรียบร้อย', 'success');
                document.getElementById('recordForm').reset();
                setTxType('income'); // กลับค่าเริ่มต้น
                loadDashboardData(); // อัปเดตประวัติ
            })
            .catch(error => {
                console.error('Error:', error);
                Swal.fire('ผิดพลาด', 'ไม่สามารถเชื่อมต่อฐานข้อมูลได้', 'error');
            });
        }

        // --- โหลดข้อมูลย้อนหลัง (API GET) ---
        function loadDashboardData() {
            const historyContainer = document.getElementById('historyData');
            
            fetch(API_URL)
            .then(response => response.json())
            .then(data => {
                if(data.length === 0) {
                    historyContainer.innerHTML = '<p class="text-center text-gray-500 mt-10">ยังไม่มีรายการบันทึก</p>';
                    return;
                }
                
                let html = '<ul class="space-y-3">';
                for(let i = data.length - 1; i >= 0; i--) {
                    let item = data[i];
                    let isIncome = item.type === 'income';
                    let colorClass = isIncome ? 'text-green-600' : (item.category === 'Wants' ? 'text-red-500' : 'text-orange-500');
                    let sign = isIncome ? '+' : '-';
                    let dateStr = new Date(item.timestamp).toLocaleDateString('th-TH');

                    html += `
                    <li class="flex justify-between items-center bg-white p-3 rounded-lg border border-gray-100 shadow-sm">
                        <div>
                            <p class="font-bold text-sm text-gray-700">${item.category}</p>
                            <p class="text-xs text-gray-400">${dateStr} • ${item.note}</p>
                        </div>
                        <div class="${colorClass} font-bold text-lg">
                            ${sign}${item.amount} ฿
                        </div>
                    </li>`;
                }
                html += '</ul>';
                historyContainer.innerHTML = html;
            })
            .catch(error => {
                console.error('Error fetching data:', error);
                historyContainer.innerHTML = '<p class="text-center text-red-500 mt-10">ดึงข้อมูลล้มเหลว โปรดตรวจสอบ URL ของ API</p>';
            });
        }
    </script>
</body>
</html>
